site_name: CTH Wiki
docs_dir: docs
theme:
  name: readthedocs
  features:
    - navigation.tabs
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
nav:
  - CTH Dokumentace:
      - Přehled: cth/kontext.md
      - Kontrakty: cth/kontrakty.md
      - Stanoviště: cth/stanoviste.md
      - Model trhu: cth/model_trhu.md
  - Návrhy k CTH:
      - Koncept hry: cth_navrhy/koncept.md
      - Návrh 1: cth_navrhy/navrh1.md
      - Návrh 2: cth_navrhy/navrh2.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      inline_syntax: ['dollar', 'round']
      block_syntax: ['dollar', 'round']
      generic: true
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
